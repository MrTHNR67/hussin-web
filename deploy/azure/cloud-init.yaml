#cloud-config
package_update: false
packages:
  - ca-certificates
  - curl
  - git
  - cifs-utils

write_files:
  - path: /etc/siyaj.env
    owner: root:root
    permissions: '0600'
    content: |
      PORT=3000
      NODE_ENV=deployment
      DATABASE_URL=__DATABASE_URL__
      DATABASE_PASSWORD=__DATABASE_PASSWORD__
      SIYAJ_DATA_DIR=/srv/siyaj-data
      SIYAJ_ADMIN_EMAILS=__ADMIN_EMAILS__

  - path: /usr/local/sbin/siyaj-mount.sh
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -u
      mkdir -p /srv/siyaj-data
      for attempt in 1 2 3 4 5 6 7 8; do
        if mountpoint -q /srv/siyaj-data; then exit 0; fi
        if mount -t cifs '__MOUNT_SOURCE__' /srv/siyaj-data -o '__MOUNT_OPTIONS__'; then
          echo "mounted $(date -Is) on $(hostname)" > /srv/siyaj-data/mount-status.txt
          exit 0
        fi
        sleep 10
      done
      echo "WARNING: shared media mount failed; media is local to this instance" >&2
      exit 0

  - path: /etc/systemd/system/siyaj.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Siyaj Solar Guardian
      After=network-online.target remote-fs.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=siyaj
      WorkingDirectory=/opt/siyaj
      EnvironmentFile=/etc/siyaj.env
      ExecStart=/usr/bin/node server.mjs
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [ bash, -lc, "curl -fsSL https://deb.nodesource.com/setup_20.x -o /tmp/nodesource_setup.sh && bash /tmp/nodesource_setup.sh && DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs" ]
  - [ bash, -lc, "id -u siyaj >/dev/null 2>&1 || useradd --system --create-home --shell /usr/sbin/nologin siyaj" ]
  - [ bash, -lc, "rm -rf /opt/siyaj && git clone --depth 1 __REPO_URL__ /opt/siyaj" ]
  - [ bash, -lc, "cd /opt/siyaj && npm ci --omit=dev --no-audit --no-fund" ]
  - [ bash, -lc, "bash /usr/local/sbin/siyaj-mount.sh" ]
  - [ bash, -lc, "chown -R siyaj:siyaj /opt/siyaj || true" ]
  - [ bash, -lc, "systemctl daemon-reload && systemctl enable --now siyaj" ]
  - [ bash, -lc, "sleep 3 && systemctl is-active siyaj" ]
