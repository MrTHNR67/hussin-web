# Local cloud topology for Siyaj:
#   3 API replicas + 1 weather microservice + nginx load balancer.
#
#   1) cp .env.example .env      (fill DATABASE_URL / SUPABASE_* with your Supabase project)
#   2) docker compose up -d --build --scale api=3
#   3) open http://localhost:8080
#
# Every API replica is stateless: sessions live in Postgres, so the load
# balancer can send a request to any replica.

services:
  weather:
    build:
      context: .
      dockerfile: services/weather/Dockerfile
    environment:
      PORT: "4001"
    expose:
      - "4001"
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      WEATHER_SERVICE_URL: http://weather:4001
      SESSION_IDLE_DAYS: "7"
    expose:
      - "3000"
    depends_on:
      - weather
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
