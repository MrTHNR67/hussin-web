# ---------------------------------------------------------------------------
# Siyaj load balancer for a Windows nginx installation (no Docker).
#
#   1) Download nginx/Windows from https://nginx.org/en/download.html
#   2) Extract to C:\nginx
#   3) Copy this file over C:\nginx\conf\nginx.conf (back up the original first)
#   4) Start the three API instances:  powershell -File scripts\start-cluster.ps1
#   5) Start nginx:  cd C:\nginx ; .\nginx.exe
#   6) Open http://localhost:8080
#
# Stop nginx with:  cd C:\nginx ; .\nginx.exe -s stop
# ---------------------------------------------------------------------------

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    upstream siyaj_upstream {
        least_conn;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=15s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=15s;
        server 127.0.0.1:3003 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://siyaj_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
