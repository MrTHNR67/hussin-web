# ---------------------------------------------------------------------------
# Siyaj load balancer for Docker Compose.
# Mounted at /etc/nginx/conf.d/default.conf.
#
# `resolve` + `zone` require nginx >= 1.27.3 (the nginx:1.27-alpine image is
# newer than that). Docker's embedded DNS returns one address per replica, so
# nginx re-resolves the `api` service every 10 seconds.
# ---------------------------------------------------------------------------

resolver 127.0.0.11 valid=10s ipv6=off;

upstream siyaj_api {
    zone siyaj_api 64k;
    least_conn;
    server api:3000 resolve max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    location / {
        proxy_pass http://siyaj_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
